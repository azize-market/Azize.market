<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commander - Azize Market</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            letter-spacing: 2px;
        }

        .container {
            width: 92%;
            max-width: 600px;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .product-info {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #333;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            background: #111;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>AZIZE MARKET</h1>
    <p>Passer une commande</p>
</header>

<div class="container">

    <div class="form-box">

        <h2>Informations de livraison</h2>

        <div class="product-info">
            <strong>Produit :</strong> Montre Classic<br>
            <strong>Prix :</strong> 4 500 DA
        </div>

        <form>

            <label>Nom</label>
            <input type="text" placeholder="Votre nom" required>

            <label>Prénom</label>
            <input type="text" placeholder="Votre prénom" required>

            <label>Numéro de téléphone</label>
            <input
                type="tel"
                placeholder="05 XX XX XX XX"
                required
            >

            <label>Wilaya</label>
            <select required>
                <option value="">Choisir votre wilaya</option>
                <option>Alger</option>
                <option>Blida</option>
                <option>Médéa</option>
                <option>Djelfa</option>
                <option>Tipaza</option>
                <option>Bouira</option>
                <option>Oran</option>
                <option>Constantine</option>
            </select>

            <label>Commune</label>
            <input
                type="text"
                placeholder="Votre commune"
                required
            >

            <label>Adresse</label>
            <textarea
                placeholder="Votre adresse complète"
                required
            ></textarea>

            <button type="submit" class="submit-btn">
                Confirmer la commande
            </button>

        </form>

    </div>

</div>

<footer>
    © 2026 Azize Market
</footer>

</body>
</html>
