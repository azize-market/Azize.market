<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azize Market - Montres</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 6px;
            color: #ccc;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            padding-bottom: 15px;
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .product h3 {
            padding: 12px 15px 5px;
        }

        .price {
            padding: 0 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .buy {
            display: block;
            margin: 15px;
            padding: 12px;
            text-align: center;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .buy:hover {
            background: #333;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background: #111;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>AZIZE MARKET</h1>
    <p>Montres élégantes pour tous les styles</p>
</header>

<div class="container">

    <div class="title">
        <h2>Nos Montres</h2>
        <p>Découvrez notre collection</p>
    </div>

    <div class="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="Montre">
            <h3>Montre Classic</h3>
            <p class="price">4 500 DA</p>
            <a href="#" class="buy">Commander</a>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600" alt="Montre">
            <h3>Montre Premium</h3>
            <p class="price">5 500 DA</p>
            <a href="#" class="buy">Commander</a>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=600" alt="Montre">
            <h3>Montre Luxury</h3>
            <p class="price">6 000 DA</p>
            <a href="#" class="buy">Commander</a>
        </div>

    </div>

</div>

<footer>
    © 2026 Azize Market - Tous droits réservés
</footer>

</body>
</html>
